name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - parallel:
          - name: Verify action dependencies
            env:
              GH_TOKEN: ${{ github.token }}
            run: |
              gh extension install github/gh-actions-lock --pin v0.4.1
              gh actions-lock --verify
          - uses: actions/setup-node@v7.1.0
            with:
              node-version: 26.12.1
              cache: npm
              cache-dependency-path: web/package-lock.json
          - name: Set up Rust
            run: |
              rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
              rustup default 1.98.1
      # Rust embeds these assets at compile time.
      - name: Build GUI
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
      - parallel:
          - name: Check frontend
            working-directory: web
            run: |
              npm run check
              npm test
          - name: Check formatting and release metadata
            run: |
              cargo fmt --all -- --check
              node scripts/sync-versions.mjs --check
              node --test scripts/sync-versions.test.mjs
          - name: Check backend and service
            run: |
              cargo clippy --locked --all-targets -- -D warnings
              cargo test --locked
              cargo build --locked
              timeout 60 node --test scripts/service.test.mjs
          - name: Build release
            # A separate target directory avoids Cargo's shared build lock.
            env:
              CARGO_TARGET_DIR: target/release-build
            run: |
              cargo build --release --locked
              ./target/release-build/release/procshelf --help

  tagpr:
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that main is still the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: Songmu/tagpr@v1.21.4
        id: tagpr
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
      - name: Check the release pull request
        if: steps.tagpr.outputs.pull_request != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.tagpr.outputs.pull_request }}
        run: |
          number=$(printf '%s' "$RELEASE_PR" | jq -r .number)
          branch=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"


  release:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tagpr.outputs.tag }}
