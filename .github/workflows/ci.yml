name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify action dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
      - uses: PromyLOPh/guix-install-action@v1.6
        with:
          pullAfterInstall: false
      - name: Select Guix channel
        run: sudo /var/guix/profiles/per-user/root/current-guix/bin/guix pull -C channels.scm
      - run: ./scripts/check
      - name: Build release
        run: |
          ./scripts/dev cargo build --release --locked
          ./target/release/procshelf --help

  tagpr:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that main is still the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - uses: PromyLOPh/guix-install-action@v1.6
        with:
          pullAfterInstall: false
      - name: Select Guix channel
        run: sudo /var/guix/profiles/per-user/root/current-guix/bin/guix pull -C channels.scm
      - uses: Songmu/tagpr@v1.21.4
        id: tagpr
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
      - name: Check the release pull request
        if: steps.tagpr.outputs.pull_request != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.tagpr.outputs.pull_request }}
        run: |
          number=$(printf '%s' "$RELEASE_PR" | jq -r .number)
          branch=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
